name: Secrets Scanner

on:
  workflow_call:
  push:
  pull_request:
  schedule:
    - cron: '43 6 * * *'

jobs:
  fides:
    # The scan itself, and the issue it files on a finding, live in
    # mabel-dev/opteryx.app/.github/workflows/fides_scan.yaml. Only the
    # triggers above are per-repository.
    uses: mabel-dev/opteryx.app/.github/workflows/fides_scan.yaml@main
    secrets:
      FIDES_ISSUE_TOKEN: ${{ secrets.FIDES_ISSUE_TOKEN }}
