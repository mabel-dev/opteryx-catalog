[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opteryx-catalog"
version = "0.4.105"
description = "Opteryx Cloud Catalog"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
    { name = "joocer", email = "justin.joyce@joocer.com" }
]
license = { file = "LICENSE" }
keywords = ["opteryx", "catalog", "firestore", "gcs"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
urls = { "Homepage" = "https://github.com/mabel-dev/opteryx-catalog" }
requires-python = ">=3.9"
dependencies = [
    "google-cloud-firestore==2.*",
    "google-cloud-storage==3.*",
    "requests==2.*",
]

[project.optional-dependencies]
# Parquet read/write. Every rugo import under opteryx_catalog/ is function-local,
# so the catalog imports and its metadata operations work without this installed
# -- only the paths that touch data files need it.
#
# NOTE: rugo vendors the matching draken inside its own wheel (draken/__init__.py,
# draken_native, morsels, vectors, interop) and links it by C ABI. Nothing may
# install the separately published `draken` distribution alongside it: that
# package is an older, differently-shaped build of the same import name, so pip
# overwrites rugo's vendored files with mismatched ones and importing rugo dies
# with "undefined symbol: draken_vector_own_string" or "Vector size changed
# (40 vs 32)". Keeping draken out of the environment is the whole fix -- no
# upper bound needed here, 0.4.21 and 0.4.26 both import clean on their own.
parquet = [
    "rugo>=0.4.21"
]
webhooks = [
    "google-cloud-tasks>=2.16.0"
]
# Only opteryx_catalog/iops/s3.py needs this, and only lazily (imported inside
# S3FileIO.__init__/delete/exists) -- catalogs that never attach an S3FileIO
# work without it installed.
s3 = [
    "boto3>=1.34"
]
# Only the GitHub alert sink needs this, and only to read the token from Secret
# Manager. The default stdout sink needs nothing beyond the core dependencies.
alerts = [
    "google-cloud-secret-manager>=2.20.0"
]
# Only opteryx_catalog/security/kms.py needs these, and only lazily (imported
# inside encrypt_secret/decrypt_secret) -- catalogs that never touch a stored
# credential (workspace catalog bindings, external-table credentials) work
# without them installed.
kms = [
    "google-cloud-kms>=2.24",
    "cryptography>=42",
]
# The suite writes and reads real Parquet, so it pulls in the parquet extra
# rather than restating the rugo requirement. `draken` must NOT be added here --
# see the note on the parquet extra for what installing it does to rugo.
test = [
    "pytest>=8",
    "hypothesis>=6",
    "opteryx-catalog[parquet]"
]

[tool.setuptools.package-dir]
"" = "."

[tool.setuptools.packages.find]
where = ["."]

[tool.isort]
profile = "black"
extend_skip_glob = ["tests/**"]
skip_gitignore = true
line_length = 100
multi_line_output = 9
force_single_line = true
float_to_top = true
ensure_newline_before_comments = true

[tool.ruff]
line-length = 100
indent-width = 4
target-version = 'py313'

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 100

# Mirrors [tool.isort] above. ruff's I001 fix does not read isort's config, so
# without this ruff and `make lint` re-sort the same imports against each other.
[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.per-file-ignores]
# `scripts/` holds operational one-offs run by a human at a terminal: inspect a
# manifest, restore a snapshot, audit a log. "Catch anything, print it, move on"
# is the correct shape there - the operator reads the message and decides - and
# the same catch inside the package would not be.
#
# This is an exemption, not a verdict that the code is clean. It exists so the
# advisory lint job reports on the library only: with ~35 script findings mixed
# in, a new blind except in opteryx_catalog/ is invisible, which is the failure
# mode this whole rule is meant to prevent. Every catch inside the package is
# now either narrowed to real types or carries `# noqa: BLE001 - <why>`, so
# anything BLE001 reports from here on is genuinely new.
"scripts/*" = ["BLE001", "S110", "S112"]

# Vendored upstream (Romain Picard's distogram, 3.0.0 - see its own LICENSE.txt
# and the "changes made for Opteryx" note at the top of distogram.py). Style
# findings here are upstream's to make; fixing them locally only makes the next
# sync harder to read. Substantive changes go in that note, not silently.
"opteryx_catalog/maki_nage/*" = ["C408", "RUF059"]
[tool.pylint.logging]
logging-format-style = "new"
